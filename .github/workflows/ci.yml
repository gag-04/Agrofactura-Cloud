name: CI - AgroFactura Cloud Native Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # Job 1: Static Code Analysis and Dockerfile Linting
  # ============================================================================
  lint:
    name: Code & Container Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Code Linter (Ruff)
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Static Analysis
        run: ruff check .

      - name: Lint Billing Core Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/billing-core/Dockerfile
          failure-threshold: error

      - name: Lint Document Rendering Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/document-rendering/Dockerfile
          failure-threshold: error

  # ============================================================================
  # Job 2: Automated Unit and Integration Testing
  # ============================================================================
  test:
    name: Unit & Integration Testing
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agrofactura_test
          POSTGRES_PASSWORD: agrofactura_test_pass
          POSTGRES_DB: agrofactura_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Microservice Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/billing-core/requirements-dev.txt
          pip install -r services/document-rendering/requirements-dev.txt

      - name: Run Billing Core Tests (Unit, Fiscal Engine & API)
        env:
          DATABASE_URL: postgresql://agrofactura_test:agrofactura_test_pass@localhost:5432/agrofactura_test_db
        run: |
          cd services/billing-core
          PYTHONPATH=. pytest tests -v --cov=src --cov-report=term-missing

      - name: Run Document Rendering Tests (Jinja2 & PDF Binary)
        run: |
          cd services/document-rendering
          PYTHONPATH=. pytest tests -v --cov=src --cov-report=term-missing

  # ============================================================================
  # Job 3: Multi-Stage Build & Publication to GitHub Container Registry (GHCR)
  # ============================================================================
  build-and-publish:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: billing-core-service
            context: ./services/billing-core
            dockerfile: ./services/billing-core/Dockerfile
          - service_name: document-rendering-service
            context: ./services/document-rendering
            dockerfile: ./services/document-rendering/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata and Tags for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service_name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
